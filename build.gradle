plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
	id "me.modmuss50.mod-publish-plugin" version "1.1.0"
	id 'maven-publish'
}

version = "$project.mod_version+$project.minecraft_version"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://api.modrinth.com/maven/" }
	maven { url 'https://maven.nucleoid.xyz/releases' }
	maven { url 'https://maven.terraformersmc.com/' }
	mavenLocal()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	compileOnly("com.terraformersmc.terraform-api:terraform-biome-remapper-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-config-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-dirt-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-shapes-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-surfaces-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-tree-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc.terraform-api:terraform-wood-api-v1:${project.terraform_api_version}")
	compileOnly("com.terraformersmc:biolith-fabric:${project.biolith_version}")

	compileOnly("com.terraformersmc:terrestria:${project.terrestria_version}")
	compileOnly("maven.modrinth:cinderscapes:${project.cinderscapes_version}")
	compileOnly("com.terraformersmc:traverse:${project.traverse_version}")
	compileOnly files("libs/WoodsAndMires-2.1.2+26.2.jar")
	compileOnly("maven.modrinth:blockus:${project.blockus_version}")


	implementation include("eu.pb4:factorytools:${project.factorytools_version}")
	implementation include("maven.modrinth:mixson:${project.mixson_version}")

	implementation "eu.pb4:polymer-core:${project.polymer_version}"
	implementation("eu.pb4:polymer-blocks:${project.polymer_version}")
	implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	implementation("eu.pb4:polymer-sound-patcher:${project.polymer_version}")
	implementation "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
	implementation("eu.pb4:polymer-autohost:${project.polymer_version}")
	implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
}

publishMods {
	file = jar.archiveFile
	type = STABLE
	changelog = providers.environmentVariable("CHANGELOG").getOrElse("No changelog provided")

	displayName = "Polymer Patch Bundle ${version.get()}"
	modLoaders.addAll("fabric", "quilt")

	modrinth {
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		projectId = "WhjutnwJ"
		minecraftVersions.add(project.minecraft_version)
		requires("polymer")
		optional("blockus", "cinderscapes", "terrestria", "traverse")
	}

	github {
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("DrexHD/terraform-patch")
		commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("main")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
